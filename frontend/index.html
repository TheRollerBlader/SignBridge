<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Signbridge | Vision is Our Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdf7eb;
            /* Warm cream background */
            color: #1a1a1a;
            /* Deep charcoal */
            overflow-x: hidden;
        }

        .hero-text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero-title-top {
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.2em;
        }

        .hero-title-bottom {
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -0.04em;
            margin-top: -0.1em;
        }

        .is-text {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-style: italic;
            font-size: clamp(2rem, 6vw, 4.5rem);
            margin-top: -0.1em;
            opacity: 0.9;
        }

        .oval-video-container {
            width: clamp(180px, 30vw, 450px);
            aspect-ratio: 1.8 / 1;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            display: inline-flex;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .ai-node {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 10px #2ecc71;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.4;
            }
        }

        .nav-link {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: opacity 0.2s;
        }

        .nav-link:hover {
            opacity: 0.6;
        }

        .btn-primary {
            background-color: #2ecc71;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 999px;
            font-weight: 700;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        .logo-bar span {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        @keyframes textFlyIn {
            0% { opacity: 0; transform: scale(3) translateY(-20px); filter: blur(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        @keyframes expandOval {
            0% { opacity: 0; transform: scale(0); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        .animate-fade-up {
            animation: textFlyIn 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            will-change: transform, opacity, filter;
            transform-origin: center center;
        }

        .animate-oval {
            animation: expandOval 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            will-change: transform, opacity, filter;
            transform-origin: center center;
            display: inline-flex;
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.6s; }
    </style>
</head>

<body class="min-h-screen flex flex-col">

                <path d="M4 12C4 12 7 8 12 8C17 8 20 12 20 12" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" />
                <circle cx="7" cy="14" r="2" fill="currentColor" />
                <circle cx="17" cy="14" r="2" fill="currentColor" />

            <span class="font-extrabold text-sm tracking-tighter">PROJECT SIGNBRIDGE</span>

        <div class="hidden md:flex items-center gap-10">

            <a href="methodology.html" class="nav-link">METHODOLOGY</a>
            <a href="demo.html" class="nav-link">DEMO</a>
            <a href="team.html" class="nav-link">TEAM</a>
        </div>

        <div class="flex items-center gap-4">

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">

        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 text-center pt-10 pb-20">

            <!-- Row 1: Vision + Video -->

                    <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&q=80&w=800"

                    <div class="absolute inset-0 flex items-center justify-center">
                        <span
                            class="text-[8px] font-bold text-white bg-green-500/90 px-2 py-0.5 rounded tracking-widest uppercase shadow-lg shadow-green-500/20">LIVE
                            DATA</span>
                    </div>

            </div>

            <!-- Row 2: is Our -->
            <div class="is-text animate-fade-up delay-200">

            <!-- Row 3: Bridge -->
            <div class="hero-title-bottom animate-fade-up delay-300">

            </div>
        </div>

        <!-- Call to Actions -->
        <div class="mt-14 flex flex-col md:flex-row items-center gap-8 animate-fade-up delay-400">
            <a href="demo.html" class="btn-primary" style="text-decoration:none;">TRY LIVE DEMO</a>
            <a href="methodology.html"
                class="flex items-center gap-2 text-sm font-bold opacity-80 hover:opacity-100 transition-opacity">
                OUR METHODOLOGY
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="px-8 md:px-16 py-12 border-t border-black/5 animate-fade-up delay-500">
        <div class="flex flex-col md:flex-row items-center justify-between gap-8 logo-bar">
            <div class="flex items-center gap-2 opacity-60">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span class="uppercase">SECURE DATA</span>
            </div>

            <div class="flex flex-wrap justify-center items-center gap-12 grayscale opacity-40">
                <span class="font-black">HACKATHON_2024</span>
                <span class="font-serif italic text-lg">DeepMind</span>
                <span class="font-bold tracking-tighter">MEDIA<span class="font-light">PIPE</span></span>
                <span class="font-mono">PYTORCH</span>
            </div>

            <div class="flex items-center gap-4 opacity-60">

                <div class="w-8 h-8 rounded-full border border-black flex items-center justify-center">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"

                        <path d="M7 13l5 5 5-5M7 6l5 5 5-5" />

</body>

</html>
