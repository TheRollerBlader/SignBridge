<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Signbridge | Vision is Our Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(-45deg, #FFF9F0, #F0E0C8, #FBF0DF, #E4D0AB);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #2c2b29;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Prevent Scrollbar Jitter from Layout Shifts */
        ::-webkit-scrollbar {
            display: none;
        }

        html,
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        ::selection {
            background: rgba(46, 204, 113, 0.2);
            color: #1a1a1a;
        }

        /* Typography Refinement */
        .hero-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.25em;
        }

        .hero-title-bold {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .is-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-style: italic;
            font-size: clamp(2rem, 5vw, 4rem);
            opacity: 0.7;
            margin: -0.8em 0 -0.05em 0;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 10;
        }

        /* Glassmorphism & Soft Lighting */
        .glass-panel,
        .glass-btn,
        .glass-nav {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 4px 24px -1px rgba(0, 0, 0, 0.02),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.7);
            box-shadow:
                0 12px 32px -4px rgba(0, 0, 0, 0.04),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        /* Oval Media Container with Diffused Lighting */
        .oval-video-container {
            width: clamp(160px, 28vw, 400px);
            aspect-ratio: 16 / 9;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            display: inline-flex;
            box-shadow:
                0 20px 60px -10px rgba(0, 0, 0, 0.08),
                inset 0 0 0 1px rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        /* Smooth Animations (Optimized to fix choppiness) */
        @keyframes floatUpSpring {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes expandSpring {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes flyIn {
            0% {
                opacity: 0;
                transform: scale(3) translateY(-10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes liquidDrift {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-6px) rotate(0.5deg);
            }
        }

        .animate-spring-up {
            animation: floatUpSpring 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            will-change: transform, opacity;
        }

        .animate-spring-expand {
            animation: expandSpring 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            will-change: transform, opacity;
            display: inline-flex;
        }

        .animate-fly-in {
            animation: flyIn 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            will-change: transform, opacity;
        }

        .liquid-drift {
            animation: liquidDrift 12s ease-in-out infinite;
        }

        /* Node pulse soft */
        .ai-node-soft {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 20px 4px rgba(255, 255, 255, 0.6);
            animation: softPulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes softPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.6);
                opacity: 1;
            }
        }

        /* Staggered Delays */
        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.35s;
        }

        .delay-400 {
            animation-delay: 0.5s;
        }

        .delay-500 {
            animation-delay: 0.65s;
        }

        /* Header Restore */
        .brand-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: rgba(0, 0, 0, 0.8);
        }

        .btn-repo {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Links */
        .nav-link {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(44, 43, 41, 0.6);
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: rgba(44, 43, 41, 0.8);
            transition: width 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .nav-link:hover {
            color: rgba(44, 43, 41, 1);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Primary Action Smooth */
        .btn-primary-liquid {
            background-color: rgba(46, 204, 113, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1.1rem 2.8rem;
            border-radius: 999px;
            font-weight: 500;
            letter-spacing: 0.05em;
            font-size: 0.85rem;
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 10px 30px -5px rgba(46, 204, 113, 0.3);
        }

        .btn-primary-liquid:hover {
            background-color: rgba(46, 204, 113, 1);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px -5px rgba(46, 204, 113, 0.4);
        }

        .light-glow {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%);
            top: -10vw;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            pointer-events: none;
        }

        .footer-text {
            color: rgba(44, 43, 41, 0.4);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col relative overflow-x-hidden">
    <!-- Ambient Diffused Lighting -->
    <div class="light-glow"></div>

    <!-- Navigation -->
    <nav class="flex items-center justify-between px-8 md:px-16 py-8 animate-spring-up w-full z-20">
        <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <img src="logo.svg" alt="Signbridge Logo"
                class="h-24 md:h-[7.5rem] w-auto object-contain hover:scale-[1.03] transition-transform duration-500 origin-left">

        </a>

        <div class="hidden md:flex items-center gap-10 glass-nav px-8 py-3 rounded-full">
            <a href="technology.html" class="nav-link">TECHNOLOGY</a>
            <a href="methodology.html" class="nav-link">METHODOLOGY</a>
            <a href="demo.html" class="nav-link">DEMO</a>
            <a href="team.html" class="nav-link">TEAM</a>
        </div>

        <div class="flex items-center gap-4">
            <a href="https://github.com/TheRollerBlader/SignBridge.git" target="_blank"
                class="btn-repo glass-btn px-6 py-2.5 rounded-full text-black/80">
                VIEW REPO
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 text-center z-10 relative">
        <div class="flex flex-col items-center justify-center liquid-drift">

            <!-- Row 1: Vision + Video -->
            <div class="hero-title animate-fly-in delay-100">
                <span>Vision</span>
                <div class="oval-video-container animate-spring-expand delay-200 mx-3">
                    <div class="ai-node-soft" style="top: 35%; left: 45%;"></div>
                    <div class="ai-node-soft" style="top: 50%; left: 65%; animation-delay: 1s;"></div>
                    <div class="ai-node-soft" style="top: 65%; left: 40%; animation-delay: 2s;"></div>
                    <img src="images/hero_image.png" alt="Vision"
                        class="w-full h-full object-cover opacity-90 transition-opacity duration-1000 hover:opacity-100 pointer-events-none">
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">

                    </div>
                </div>
            </div>

            <!-- Row 2: is Our -->
            <div class="is-text animate-fly-in delay-300">
                is our
            </div>

            <!-- Row 3: Bridge -->
            <div class="hero-title animate-fly-in delay-400">
                <span class="hero-title-bold">Bridge</span>
            </div>
        </div>

        <!-- Call to Actions -->
        <div class="mt-20 flex flex-col md:flex-row items-center gap-10 animate-spring-up delay-500">
            <a href="demo.html" class="btn-primary-liquid" style="text-decoration:none;">
                Experience Demo
            </a>
            <a href="methodology.html"
                class="group flex items-center gap-3 text-[0.8rem] font-medium tracking-[0.05em] text-black/60 hover:text-black/100 transition-colors duration-500">
                Discover Methodology
                <div
                    class="w-8 h-8 rounded-full border border-black/10 flex items-center justify-center group-hover:bg-white group-hover:border-white/50 group-hover:shadow-[0_4px_12px_rgba(0,0,0,0.05)] transition-all duration-500">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        class="transform group-hover:translate-x-0.5 transition-transform duration-500">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="px-8 md:px-16 py-10 animate-spring-up delay-500 z-10 w-full relative">
        <div class="flex flex-col md:flex-row items-center justify-between gap-10">
            <div class="flex items-center gap-3 footer-text font-medium text-[0.7rem] tracking-[0.1em]">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span class="uppercase">Private by Design</span>
            </div>

            <div class="flex flex-wrap justify-center items-center gap-10 grayscale opacity-30 text-xs tracking-wider">
                <span class="font-light">Hackathon '24</span>
                <span class="font-serif italic text-sm">DeepMind</span>
                <span class="font-medium">MediaPipe</span>
                <span class="font-mono">PyTorch</span>
            </div>

            <div class="flex items-center gap-4 footer-text font-medium text-[0.65rem] tracking-[0.15em] uppercase">
                <span>Explore</span>
                <div
                    class="w-8 h-8 rounded-full border border-black/10 flex items-center justify-center group hover:bg-white/50 transition-colors duration-500 cursor-pointer">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        class="transform group-hover:translate-y-0.5 transition-transform duration-500">
                        <path d="M7 13l5 5 5-5M7 6l5 5 5-5" />
                    </svg>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
